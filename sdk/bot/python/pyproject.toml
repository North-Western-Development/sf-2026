[build-system]
requires = ["hatchling>=1.21"]
build-backend = "hatchling.build"

[project]
name = "subspace-bot"
version = "0.1.0"
description = "Build bots for Subspace Frequency: REST, the real-time gateway, slash commands and interactions."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "North Western Development" }]
keywords = ["subspace", "bot", "sdk", "gateway", "slash-commands", "asyncio"]
classifiers = [
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Framework :: AsyncIO",
  "Typing :: Typed",
  "Intended Audience :: Developers",
  "Topic :: Communications :: Chat",
]
dependencies = [
  "aiohttp>=3.9,<4",
  "cryptography>=41",
  "typing_extensions>=4.4; python_version < '3.11'",
]

[project.optional-dependencies]
test = ["pytest>=8", "pytest-asyncio>=0.23"]

[tool.hatch.build.targets.wheel]
packages = ["src/subspace_bot"]

[tool.hatch.build.targets.sdist]
include = ["src/subspace_bot", "tests", "examples", "README.md", "pyproject.toml"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
