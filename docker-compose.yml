name: subspace-frequency

# Shared service environment. Secrets have no defaults here: copy .env.example to .env
# and fill them in (compose refuses to start when a required value is missing).
x-service-env: &service-env
  NODE_ENV: production
  JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env}
  DATABASE_URL: postgresql://${POSTGRES_USER:-subspace}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@postgres:5432/${POSTGRES_DB:-subspace_frequency}
  REDIS_URL: redis://redis:6379

networks:
  subspace_net:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  minio_data:

services:
  postgres:
    image: postgres:16-alpine
    container_name: subspace-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-subspace}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-subspace_frequency}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - subspace_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-subspace} -d ${POSTGRES_DB:-subspace_frequency}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: subspace-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    networks:
      - subspace_net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  minio:
    image: minio/minio:latest
    container_name: subspace-minio
    restart: unless-stopped
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?set MINIO_ROOT_USER in .env}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?set MINIO_ROOT_PASSWORD in .env}
    volumes:
      - minio_data:/data
    networks:
      - subspace_net
    # Object access goes through the web edge; the console stays loopback-only.
    ports:
      - "127.0.0.1:9001:9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5

  livekit:
    image: livekit/livekit-server:latest
    container_name: subspace-livekit
    restart: unless-stopped
    command: ["--config", "/etc/livekit.yaml"]
    environment:
      LIVEKIT_KEYS: "${LIVEKIT_API_KEY:?set LIVEKIT_API_KEY in .env}: ${LIVEKIT_API_SECRET:?set LIVEKIT_API_SECRET in .env}"
    volumes:
      - ./docker/livekit.yaml:/etc/livekit.yaml:ro
    networks:
      - subspace_net
    ports:
      - "7881:7881"
      - "50000-50100:50000-50100/udp"
    depends_on:
      redis:
        condition: service_healthy

  # Applies the schema before anything else starts (see docker/Dockerfile.migrate).
  migrate:
    build:
      context: .
      dockerfile: docker/Dockerfile.migrate
    container_name: subspace-migrate
    restart: "no"
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-subspace}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@postgres:5432/${POSTGRES_DB:-subspace_frequency}
    networks:
      - subspace_net
    depends_on:
      postgres:
        condition: service_healthy

  api-service:
    build:
      context: .
      dockerfile: docker/Dockerfile.api
    container_name: subspace-api
    restart: unless-stopped
    environment:
      <<: *service-env
      API_PORT: 3001
      LIVEKIT_API_KEY: ${LIVEKIT_API_KEY}
      LIVEKIT_API_SECRET: ${LIVEKIT_API_SECRET}
      LIVEKIT_PUBLIC_URL: ${LIVEKIT_PUBLIC_URL:-}
      PUBLIC_ORIGIN: ${PUBLIC_ORIGIN:?set PUBLIC_ORIGIN in .env}
      WEBAUTHN_ORIGINS: ${WEBAUTHN_ORIGINS:-}
      RP_ID: ${RP_ID:-}
      MEDIA_PROXY_SECRET: ${MEDIA_PROXY_SECRET:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_FROM: ${SMTP_FROM:-}
      EMAIL_LINK_BASE: ${EMAIL_LINK_BASE:-}
      EXPO_ACCESS_TOKEN: ${EXPO_ACCESS_TOKEN:-}
    networks:
      - subspace_net
    depends_on:
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  gateway-service:
    build:
      context: .
      dockerfile: docker/Dockerfile.gateway
    container_name: subspace-gateway
    restart: unless-stopped
    environment:
      <<: *service-env
      GATEWAY_PORT: 3002
    networks:
      - subspace_net
    depends_on:
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  file-service:
    build:
      context: .
      dockerfile: docker/Dockerfile.file
    container_name: subspace-file
    restart: unless-stopped
    environment:
      <<: *service-env
      FILE_PORT: 3003
      S3_ENDPOINT: minio:9000
      S3_PUBLIC_ENDPOINT: ${PUBLIC_ORIGIN:?set PUBLIC_ORIGIN in .env}
      S3_BUCKET: subspace-vault
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GOOGLE_API_KEY: ${GOOGLE_API_KEY:-}
      ONEDRIVE_CLIENT_ID: ${ONEDRIVE_CLIENT_ID:-}
      ONEDRIVE_CLIENT_SECRET: ${ONEDRIVE_CLIENT_SECRET:-}
      DROPBOX_APP_KEY: ${DROPBOX_APP_KEY:-}
      DROPBOX_APP_SECRET: ${DROPBOX_APP_SECRET:-}
      DRIVE_REDIRECT_BASE: ${DRIVE_REDIRECT_BASE:-}
      DRIVE_TOKEN_KEY: ${DRIVE_TOKEN_KEY:-}
    networks:
      - subspace_net
    depends_on:
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy

  badge-worker:
    build:
      context: .
      dockerfile: docker/Dockerfile.badge
    container_name: subspace-badge-worker
    restart: unless-stopped
    environment:
      <<: *service-env
    networks:
      - subspace_net
    depends_on:
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  # Single public entrypoint: SPA + reverse proxy for api, gateway, vault, storage and LiveKit signaling.
  web:
    build:
      context: .
      dockerfile: docker/Dockerfile.web
    container_name: subspace-web
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-8080}:80"
    networks:
      - subspace_net
    depends_on:
      - api-service
      - gateway-service
      - file-service
      - livekit
