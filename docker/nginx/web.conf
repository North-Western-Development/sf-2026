# Single-origin edge for the Subspace web client.
# Everything the browser talks to is served from this host so no internal service
# ports need to be published.

map $http_upgrade $connection_upgrade {
  default upgrade;
  ''      close;
}

server {
  listen 80;
  server_name _;

  client_max_body_size 55m;

  # nginx drops inherited add_header when a location sets its own, so locations re-include this.
  include /etc/nginx/snippets/security-headers.conf;

  resolver 127.0.0.11 valid=30s;

  # Subspace Vault (file-service owns every /api/v1/vault route)
  location /api/v1/vault/ {
    set $file_upstream http://file-service:3003;
    proxy_pass $file_upstream;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # Media upload tickets (file-service owns every /api/v1/media route)
  location /api/v1/media/ {
    set $file_upstream http://file-service:3003;
    proxy_pass $file_upstream;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location /api/ {
    set $api_upstream http://api-service:3001;
    proxy_pass $api_upstream;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location /gateway {
    set $gateway_upstream http://gateway-service:3002;
    proxy_pass $gateway_upstream;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_set_header Host $host;
    proxy_read_timeout 120s;
  }

  # LiveKit signaling (livekit-client connects to <origin>/rtc)
  location /rtc {
    set $livekit_upstream http://livekit:7880;
    proxy_pass $livekit_upstream;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_set_header Host $host;
    proxy_read_timeout 3600s;
  }

  # Presigned object storage. Host is preserved so MinIO can verify signatures
  # generated against S3_PUBLIC_ENDPOINT.
  location /subspace-vault/ {
    # User content: never executable in our origin.
    add_header Content-Security-Policy "sandbox; default-src 'none'; img-src 'self' data:; media-src 'self'; style-src 'unsafe-inline'" always;
    add_header X-Content-Type-Options nosniff always;
    set $minio_upstream http://minio:9000;
    proxy_pass $minio_upstream;
    proxy_set_header Host $http_host;
    proxy_request_buffering off;
    proxy_buffering off;
  }

  # Public-read media bucket (avatars, banners, icons, glyphs). Anonymous GET only;
  # the bucket policy set by file-service on boot enforces read-only.
  location /subspace-media/ {
    # User content: never executable in our origin.
    add_header Content-Security-Policy "sandbox; default-src 'none'; img-src 'self' data:; media-src 'self'; style-src 'unsafe-inline'" always;
    add_header X-Content-Type-Options nosniff always;
    set $minio_upstream http://minio:9000;
    proxy_pass $minio_upstream;
    proxy_set_header Host $http_host;
    proxy_request_buffering off;
    proxy_buffering off;
  }

  location /assets/ {
    root /usr/share/nginx/html;
    expires 1y;
    add_header Cache-Control "public, immutable";
    include /etc/nginx/snippets/security-headers.conf;
    try_files $uri =404;
  }

  # Twemoji images (copied into the build by the twemoji-files Vite plugin); versioned with the package.
  location /emoji/ {
    root /usr/share/nginx/html;
    expires 1y;
    add_header Cache-Control "public, immutable";
    include /etc/nginx/snippets/security-headers.conf;
    try_files $uri =404;
  }

  # The beacon widget is meant to be embedded on other sites, so it may be framed.
  location /widget/ {
    root /usr/share/nginx/html;
    add_header Cache-Control "no-cache";
    include /etc/nginx/snippets/security-headers-embed.conf;
    try_files /index.html =404;
  }

  location / {
    root /usr/share/nginx/html;
    add_header Cache-Control "no-cache";
    include /etc/nginx/snippets/security-headers.conf;
    try_files $uri /index.html;
  }
}
