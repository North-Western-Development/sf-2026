# Host nginx for a Subspace Frequency instance (http context; include from nginx.conf or drop
# into /etc/nginx/conf.d/). Replace subspace.click with your domain throughout.
#
# The whole app is one origin: the browser, desktop and mobile apps talk only to
# https://subspace.click, and the web edge container (127.0.0.1:8080) routes /api, /gateway,
# /rtc and storage to the right service. One origin means no CORS, one passkey relying party,
# and one TLS certificate. See docs: guides/domains.
#
# Certificates: certbot certonly --webroot -w /var/www/certbot \
#   -d subspace.click -d app.subspace.click -d docs.subspace.click -d storage.subspace.click

map $http_upgrade $subspace_connection_upgrade {
  default upgrade;
  ''      close;
}

upstream subspace_edge {
  server 127.0.0.1:8080;
  keepalive 32;
}

# Plain HTTP: certificate challenges, then everything moves to HTTPS.
server {
  listen 80;
  listen [::]:80;
  server_name subspace.click app.subspace.click docs.subspace.click storage.subspace.click;

  location /.well-known/acme-challenge/ {
    root /var/www/certbot;
  }

  location / {
    return 301 https://$host$request_uri;
  }
}

# The app (web client, API, gateway, LiveKit signaling, file storage), via the web edge.
server {
  listen 443 ssl;
  listen [::]:443 ssl;
  http2 on;
  server_name subspace.click app.subspace.click;

  ssl_certificate /etc/letsencrypt/live/subspace.click/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/subspace.click/privkey.pem;
  ssl_protocols TLSv1.2 TLSv1.3;
  ssl_prefer_server_ciphers off;
  ssl_session_cache shared:subspace_ssl:10m;
  ssl_session_timeout 1d;

  add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;

  # Attachments are up to 50 MB; uploads go straight through to storage.
  client_max_body_size 55m;
  proxy_request_buffering off;

  # app.subspace.click is an alias: keep one origin for passkeys and sessions.
  if ($host = app.subspace.click) {
    return 301 https://subspace.click$request_uri;
  }

  location / {
    proxy_pass http://subspace_edge;
    proxy_http_version 1.1;
    # The original Host matters: presigned storage URLs are signed for it.
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header Connection "";
    proxy_read_timeout 120s;
  }

  # Long-lived WebSockets: the real-time gateway and LiveKit signaling.
  location ~ ^/(gateway|rtc) {
    proxy_pass http://subspace_edge;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $subspace_connection_upgrade;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
  }
}

# Documentation site: static files from `pnpm --filter @subspace/docs build`.
server {
  listen 443 ssl;
  listen [::]:443 ssl;
  http2 on;
  server_name docs.subspace.click;

  ssl_certificate /etc/letsencrypt/live/subspace.click/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/subspace.click/privkey.pem;
  ssl_protocols TLSv1.2 TLSv1.3;

  add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;

  root /var/www/subspace-docs;
  index index.html;

  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  location / {
    try_files $uri $uri.html $uri/ =404;
  }

  error_page 404 /404.html;
}

# MinIO console, for instance staff only. Allow your own addresses before enabling.
server {
  listen 443 ssl;
  listen [::]:443 ssl;
  http2 on;
  server_name storage.subspace.click;

  ssl_certificate /etc/letsencrypt/live/subspace.click/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/subspace.click/privkey.pem;
  ssl_protocols TLSv1.2 TLSv1.3;

  # allow 203.0.113.10;
  deny all;

  location / {
    proxy_pass http://127.0.0.1:9001;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $subspace_connection_upgrade;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto https;
  }
}
