# The app's routes, shared by the public HTTPS site and the loopback test listener.
# Everything is one origin: the web client, /api, /gateway, /rtc and storage.

client_max_body_size 55m;
include /etc/nginx/snippets/subspace-headers.conf;

# Subspace Vault and media upload tickets belong to the file service.
location /api/v1/vault/ {
  proxy_pass http://127.0.0.1:3003;
  include /etc/nginx/snippets/subspace-proxy.conf;
  proxy_read_timeout 120s;
}
location /api/v1/media/ {
  proxy_pass http://127.0.0.1:3003;
  include /etc/nginx/snippets/subspace-proxy.conf;
  proxy_read_timeout 120s;
}
location /api/ {
  proxy_pass http://127.0.0.1:3001;
  include /etc/nginx/snippets/subspace-proxy.conf;
  proxy_read_timeout 120s;
}

location /gateway {
  proxy_pass http://127.0.0.1:3002;
  include /etc/nginx/snippets/subspace-proxy.conf;
  proxy_set_header Upgrade $http_upgrade;
  proxy_set_header Connection $subspace_connection_upgrade;
  proxy_read_timeout 3600s;
  proxy_send_timeout 3600s;
}

# LiveKit signaling (livekit-client connects to <origin>/rtc).
location /rtc {
  proxy_pass http://127.0.0.1:7880;
  include /etc/nginx/snippets/subspace-proxy.conf;
  proxy_set_header Upgrade $http_upgrade;
  proxy_set_header Connection $subspace_connection_upgrade;
  proxy_read_timeout 3600s;
  proxy_send_timeout 3600s;
}

# Presigned object storage. Host is kept so MinIO can check signatures made for the public origin.
# Uploads stream straight through; the size limit is signed into each URL, so storage groups can
# allow files larger than client_max_body_size here.
location ~ ^/(subspace-vault|subspace-media)/ {
  client_max_body_size 0;
  proxy_request_buffering off;
  proxy_buffering off;
  proxy_pass http://127.0.0.1:9000;
  proxy_http_version 1.1;
  proxy_set_header Host $http_host;
  proxy_set_header X-Forwarded-Proto $scheme;
  # User content: never executable in our origin.
  add_header Content-Security-Policy "sandbox; default-src 'none'; img-src 'self' data:; media-src 'self'; style-src 'unsafe-inline'" always;
  add_header X-Content-Type-Options nosniff always;
}

# Desktop app installers and the updater's manifest (deploy/server/publish-desktop.sh). Kept
# outside the releases, so a deploy never takes them away. The manifest is always re-checked.
location /downloads/ {
  alias /var/www/subspace-downloads/;
  # The app installers, and the desktop updater's manifest; anything else is a download.
  types {
    application/vnd.android.package-archive apk;
    application/json json;
  }
  default_type application/octet-stream;
  add_header Cache-Control "no-cache";
  include /etc/nginx/snippets/subspace-headers.conf;
  try_files $uri =404;
}

# The package registry (deploy/server/publish-packages.sh): npm, PyPI, Maven, NuGet and source
# archives as plain files, indexed by registry-index.mjs. npm asks for "@scope%2fname", which nginx
# decodes to a folder whose index.json is the package document.
# Nothing there runs as the app: links are not followed and every response is sandboxed (its own
# opaque origin, no scripts), on top of the app's headers.
location /packages/ {
  root /var/www;
  disable_symlinks on;
  add_header Cache-Control "no-cache";
  include /etc/nginx/snippets/subspace-headers.conf;
  add_header Content-Security-Policy "sandbox; default-src 'none'; style-src 'unsafe-inline'; img-src 'self' data:" always;
  try_files $uri $uri/index.json $uri/index.html =404;
}

root /opt/subspace/current/apps/web/dist;

location /assets/ {
  expires 1y;
  add_header Cache-Control "public, immutable";
  include /etc/nginx/snippets/subspace-headers.conf;
  try_files $uri =404;
}
location /emoji/ {
  expires 1y;
  add_header Cache-Control "public, immutable";
  include /etc/nginx/snippets/subspace-headers.conf;
  try_files $uri =404;
}
# The beacon widget is meant to be embedded on other sites, so it may be framed.
location /widget/ {
  add_header Cache-Control "no-cache";
  include /etc/nginx/snippets/subspace-headers-embed.conf;
  try_files /index.html =404;
}
location / {
  add_header Cache-Control "no-cache";
  include /etc/nginx/snippets/subspace-headers.conf;
  try_files $uri /index.html;
}
