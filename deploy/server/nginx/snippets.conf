### subspace-proxy.conf
proxy_http_version 1.1;
proxy_set_header Host $host;
# The services trust these only from loopback (TRUST_PROXY): the client address for rate limits.
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-For $remote_addr;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_set_header Connection "";

### subspace-headers.conf
# nginx drops inherited add_header when a location sets its own, so locations re-include this.
add_header X-Content-Type-Options nosniff always;
add_header X-Frame-Options DENY always;
add_header Referrer-Policy strict-origin-when-cross-origin always;
add_header Permissions-Policy "camera=(self), microphone=(self), display-capture=(self), geolocation=()" always;
add_header Cross-Origin-Opener-Policy same-origin always;
# frame-src https: so custom Activities (developers' pages on their own https origins) can load in
# comm-links. What actually loads is decided by the client: only Activity URLs our API hands out
# (staff-approved, or the viewer's own app to test), always in a sandboxed, credentialless frame.
# frame-ancestors 'none' (and X-Frame-Options DENY) still keep anyone from framing us.
add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://www.youtube.com https://s.ytimg.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com; img-src 'self' data: blob: https:; media-src 'self' blob: https:; connect-src 'self'; frame-src https:; worker-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;

### subspace-headers-embed.conf
add_header X-Content-Type-Options nosniff always;
add_header Referrer-Policy strict-origin-when-cross-origin always;
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com; img-src 'self' data: https:; connect-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors *" always;
