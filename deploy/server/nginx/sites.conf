### subspace-base.conf
# Always on: certificate challenges on port 80, and a loopback-only listener for testing the
# app over an SSH tunnel (ssh -L 8080:127.0.0.1:8080 deploy@host) before DNS points here.
map $http_upgrade $subspace_connection_upgrade {
  default upgrade;
  ''      close;
}

server {
  listen 80 default_server;
  listen [::]:80 default_server;
  server_name _;
  server_tokens off;

  location /.well-known/acme-challenge/ {
    root /var/www/certbot;
  }
  location / {
    return 301 https://$host$request_uri;
  }
}

server {
  listen 127.0.0.1:8080;
  server_name localhost;
  server_tokens off;
  include /etc/nginx/snippets/subspace-app.conf;
}

### subspace-tls.conf
# Enabled once certificates exist (05-certs.sh). One certificate covers every name.
server {
  listen 443 ssl default_server;
  listen [::]:443 ssl default_server;
  http2 on;
  server_name __DOMAIN__;
  server_tokens off;

  ssl_certificate /etc/letsencrypt/live/__DOMAIN__/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/__DOMAIN__/privkey.pem;
  ssl_protocols TLSv1.2 TLSv1.3;
  ssl_prefer_server_ciphers off;
  ssl_session_cache shared:subspace_ssl:10m;
  ssl_session_timeout 1d;
  ssl_session_tickets off;

  include /etc/nginx/snippets/subspace-app.conf;
}

# www. goes to the one origin (passkeys and sessions are per origin).
server {
  listen 443 ssl;
  listen [::]:443 ssl;
  http2 on;
  server_name www.__DOMAIN__;
  server_tokens off;
  ssl_certificate /etc/letsencrypt/live/__DOMAIN__/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/__DOMAIN__/privkey.pem;
  return 301 https://__DOMAIN__$request_uri;
}

# Documentation site.
server {
  listen 443 ssl;
  listen [::]:443 ssl;
  http2 on;
  server_name docs.__DOMAIN__;
  server_tokens off;
  ssl_certificate /etc/letsencrypt/live/__DOMAIN__/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/__DOMAIN__/privkey.pem;

  add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;
  root /var/www/subspace-docs;
  index index.html;
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }
  location / {
    try_files $uri $uri.html $uri/ =404;
  }
  error_page 404 /404.html;
}

# MinIO console, for instance staff only: allow your own address in /etc/nginx/subspace-staff-ips.conf.
server {
  listen 443 ssl;
  listen [::]:443 ssl;
  http2 on;
  server_name storage.__DOMAIN__;
  server_tokens off;
  ssl_certificate /etc/letsencrypt/live/__DOMAIN__/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/__DOMAIN__/privkey.pem;

  include /etc/nginx/subspace-staff-ips.conf;
  deny all;

  location / {
    proxy_pass http://127.0.0.1:9001;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $subspace_connection_upgrade;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto https;
  }
}
