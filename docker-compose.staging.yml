# Staging / production hardening, layered on docker-compose.yml:
#
#   docker compose -f docker-compose.yml -f docker-compose.staging.yml up -d --build
#
# The host's nginx terminates TLS for the public domain and proxies to the web edge on
# 127.0.0.1:${WEB_PORT}; see deploy/nginx/subspace.conf and the deployment guide. Nothing but
# the edge (loopback) and LiveKit media ports is published.

x-hardened: &hardened
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL
  logging:
    driver: json-file
    options:
      max-size: "20m"
      max-file: "5"

x-logs: &logs
  logging:
    driver: json-file
    options:
      max-size: "20m"
      max-file: "5"

services:
  postgres:
    <<: *logs
    shm_size: 256mb

  redis:
    <<: *logs
    # Durable enough for sessions and rate limits; never published.
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "512mb", "--maxmemory-policy", "noeviction"]

  minio:
    <<: *logs
    image: minio/minio:${MINIO_VERSION:-latest}

  livekit:
    <<: *logs
    image: livekit/livekit-server:${LIVEKIT_VERSION:-latest}
    volumes:
      - ./docker/livekit.staging.yaml:/etc/livekit.yaml:ro

  migrate:
    <<: *hardened

  api-service:
    <<: *hardened
    deploy:
      resources:
        limits:
          memory: 768m

  gateway-service:
    <<: *hardened
    deploy:
      resources:
        limits:
          memory: 512m

  file-service:
    <<: *hardened
    deploy:
      resources:
        limits:
          memory: 768m

  badge-worker:
    <<: *hardened
    deploy:
      resources:
        limits:
          memory: 256m

  web:
    <<: *logs
    security_opt:
      - no-new-privileges:true
    # Only the host's nginx (TLS) talks to the edge.
    ports: !override
      - "127.0.0.1:${WEB_PORT:-8080}:80"
